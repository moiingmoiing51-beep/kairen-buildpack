<style>
  :root {
    --bg: #0a0a0b;
    --bg-elev: #111114;
    --bg-elev-2: #16161a;
    --border: #1f1f24;
    --border-strong: #2a2a31;
    --text: #e6e6ea;
    --text-muted: #8a8a93;
    --text-dim: #5a5a63;
    --accent: #7c7cff;
    --accent-soft: rgba(124, 124, 255, 0.12);
    --accent-glow: rgba(124, 124, 255, 0.35);
    --success: #4ade80;
    --warning: #fbbf24;
    --code-bg: #0d0d10;
    --sans: 'Manrope', 'Noto Sans KR', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --sidebar-w: 300px;
    --toc-w: 240px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  body {
    background:
      radial-gradient(ellipse 1200px 600px at 70% -10%, rgba(124, 124, 255, 0.08), transparent 60%),
      radial-gradient(ellipse 800px 400px at 10% 110%, rgba(124, 124, 255, 0.05), transparent 60%),
      var(--bg);
    min-height: 100vh;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* Layout */
  .app {
    position: relative;
    min-height: 100vh;
  }

  /* Sidebar - fixed to viewport */
  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    width: var(--sidebar-w);
    height: 100vh;
    background: var(--bg-elev);
    border-right: 1px solid var(--border);
    padding: 28px 20px 32px;
    overflow-y: auto;
    z-index: 20;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
  }
  .brand-mark {
    width: 28px; height: 28px;
    border-radius: 7px;
    background: linear-gradient(135deg, var(--accent), #5151d1);
    display: grid; place-items: center;
    color: #fff;
    font-family: var(--mono);
    font-weight: 700;
    font-size: 14px;
    box-shadow: 0 0 24px var(--accent-glow);
  }
  .brand-text {
    font-weight: 800;
    font-size: 17px;
    letter-spacing: -0.01em;
  }
  .brand-sub {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    margin-left: 38px;
    margin-bottom: 28px;
    letter-spacing: 0.04em;
  }
  .nav-group { margin-bottom: 20px; }
  .nav-group-title {
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-dim);
    padding: 0 10px 8px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border-radius: 6px;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 13.5px;
    transition: background 0.12s, color 0.12s;
    position: relative;
    line-height: 1.35;
  }
  .nav-item:hover { background: var(--bg-elev-2); color: var(--text); }
  .nav-item.active {
    background: var(--accent-soft);
    color: var(--text);
    font-weight: 600;
  }
  .nav-item.active::before {
    content: "";
    position: absolute;
    left: -20px;
    top: 9px; bottom: 9px;
    width: 3px;
    background: var(--accent);
    border-radius: 0 3px 3px 0;
    box-shadow: 0 0 8px var(--accent-glow);
  }
  .nav-num {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    min-width: 22px;
  }
  .nav-item.active .nav-num { color: var(--accent); }

  /* Main - leave space for fixed sidebar and TOC */
  .main {
    margin-left: var(--sidebar-w);
    margin-right: var(--toc-w);
    padding: 56px 64px 120px;
    max-width: 100%;
    overflow-x: hidden;
    position: relative;
  }
  .doc-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 18px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .meta-pill {
    padding: 3px 9px;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    background: var(--bg-elev);
  }
  .meta-pill.status-active {
    border-color: rgba(74, 222, 128, 0.35);
    color: var(--success);
  }
  .meta-pill.status-draft {
    border-color: rgba(251, 191, 36, 0.35);
    color: var(--warning);
  }

  /* Markdown rendered content */
  .content {
    max-width: 760px;
    animation: fadeSlide 0.32s ease;
  }
  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .content h1 {
    font-size: 36px;
    font-weight: 800;
    letter-spacing: -0.025em;
    line-height: 1.15;
    margin-bottom: 28px;
    background: linear-gradient(180deg, #fff 0%, #c5c5cf 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .content h2 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.015em;
    margin: 44px 0 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    scroll-margin-top: 30px;
  }
  .content h3 {
    font-size: 17px;
    font-weight: 600;
    margin: 32px 0 12px;
    color: var(--text);
    scroll-margin-top: 30px;
  }
  .content h4 { font-size: 15px; font-weight: 600; margin: 24px 0 10px; }
  .content p { margin: 0 0 16px; color: #c8c8d0; }
  .content ul, .content ol { margin: 0 0 16px 24px; }
  .content li { margin-bottom: 6px; color: #c8c8d0; }
  .content li::marker { color: var(--text-dim); }
  .content strong { color: var(--text); font-weight: 700; }
  .content em { color: #d8d8df; }
  .content blockquote {
    border-left: 3px solid var(--accent);
    background: var(--accent-soft);
    padding: 14px 18px;
    margin: 18px 0;
    border-radius: 0 6px 6px 0;
    color: var(--text);
    font-style: italic;
  }
  .content code {
    font-family: var(--mono);
    font-size: 0.88em;
    background: var(--code-bg);
    padding: 2px 6px;
    border-radius: 4px;
    border: 1px solid var(--border);
    color: #e8a87c;
  }
  .content pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 18px;
    overflow-x: auto;
    margin: 16px 0 22px;
    font-size: 12.5px;
    line-height: 1.55;
  }
  .content pre code {
    background: transparent;
    border: 0;
    padding: 0;
    color: #d8d8df;
    font-size: inherit;
  }
  .content hr {
    border: 0;
    border-top: 1px solid var(--border);
    margin: 32px 0;
  }
  .content table {
    border-collapse: collapse;
    margin: 18px 0;
    width: 100%;
    font-size: 14px;
  }
  .content th, .content td {
    padding: 10px 14px;
    border: 1px solid var(--border);
    text-align: left;
  }
  .content th {
    background: var(--bg-elev);
    font-weight: 600;
  }

  /* Pager */
  .pager {
    margin-top: 64px;
    padding-top: 28px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    gap: 16px;
    max-width: 760px;
  }
  .pager a {
    flex: 1;
    padding: 16px 18px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg-elev);
    text-decoration: none;
    color: var(--text);
    transition: all 0.15s;
    display: block;
  }
  .pager a:hover {
    border-color: var(--accent);
    background: var(--bg-elev-2);
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(124, 124, 255, 0.1);
  }
  .pager .label {
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    display: block;
    margin-bottom: 4px;
  }
  .pager .title { font-weight: 600; font-size: 14px; }
  .pager .next { text-align: right; }
  .pager .disabled {
    opacity: 0.3;
    pointer-events: none;
  }

  /* TOC - fixed to viewport */
  .toc {
    position: fixed;
    top: 0;
    right: 0;
    width: var(--toc-w);
    height: 100vh;
    padding: 56px 24px 32px 12px;
    overflow-y: auto;
    border-left: 1px solid var(--border);
    z-index: 10;
    background: var(--bg);
  }
  .toc-title {
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-dim);
    margin-bottom: 14px;
    padding-left: 10px;
  }
  .toc-link {
    display: block;
    padding: 6px 10px;
    font-size: 12.5px;
    color: var(--text-muted);

# MVP Build Spec

## Mission

Kairen MVP v0는 고객의 불완전한 sourcing request와 여러 형태의 입력 파일을 RFQ-ready package로 구조화하고, supplier 후보를 정리하고, 이메일 thread를 통해 RFQ/응답/첨부파일을 관리하고, supplier response를 SQ/QI로 변환하고, item x supplier quote matrix와 decision report를 생성하는 AI-assisted sourcing workflow를 시연한다.

가장 짧은 문장:

> 고객이 메일 본문, PDF, Excel, 이미지, 개별 도면, 폴더, zip 중 어떤 형태로 주든, AI가 intake queue로 정리한 뒤 RFQ-ready spec과 supplier email draft, attachment extraction task, quote matrix, savings report를 만든다.

## MVP v0 Workflow

```text
Synthetic PR / Sourcing Request
-> intake files classification
-> RFQ-ready information extraction
-> missing information questions
-> supplier longlist
-> RFQ email draft queue
-> synthetic email thread and attachment ingestion
-> SQ creation
-> QI extraction
-> quote matrix
-> savings calculation
-> decision report
```

## Demo Scenario

첫 demo는 synthetic CNC machining case로 한다.

Demo case 구성:

- 가상의 CNC 부품 3개
- 가상의 baseline price
- 가상의 고객 입력 파일 6개
- 가상의 supplier 후보 4곳
- 가상의 supplier email response
- 가상의 Excel/PDF/image attachment metadata
- 가상의 quote line item
- quote matrix
- estimated savings
- final decision report

## Human Approval Rule

초기 원칙은 다음과 같다.

> AI extracts and drafts. Human approves.

MVP v0에서 AI는 RFQ email draft, follow-up draft, attachment extraction task, quote extraction result를 만든다. 실제 발송, 고객명 공개, 도면 공개, supplier shortlist 공개, 첨부파일 전달은 사람이 승인해야 한다.

## MVP Success Metrics

- Synthetic case 실행 시 output 파일이 모두 생성된다.
- zip이 아닌 PDF/Excel/image/text/folder input도 intake manifest로 정리된다.
- PR의 missing information이 clarification question으로 나온다.
- email thread가 supplier/RFQ/SQ와 연결된다.
- Excel/PDF/image attachment가 extraction task로 분류된다.
- SQ response가 QI row로 정규화된다.
- item x supplier quote matrix가 만들어진다.
- 일부 supplier의 quote가 빠져도 matrix가 깨지지 않는다.
- baseline 대비 best quote 기준 estimated savings가 계산된다.
- decision report가 사람이 읽고 다음 action을 정할 수 있는 수준으로 생성된다.

## Non-goals

이번 범위에서 하지 않는다.

- 승인 없는 실제 외부 이메일 발송
- 실제 고객 자료 입력
- 실제 공급사 DB 구축
- 실제 mailbox login 또는 접속 비밀값 저장
- 실제 PDF/OCR/Excel parser
- UI 구현
- PO, 결제, 입고, 검사
- 완전 자율 negotiation
- production-grade ERP 또는 database

## Recommended Technical Shape

초기 구현은 단순하게 유지한다.

- Python standard library 우선
- CSV input/output
- Markdown report
- intake file manifest
- email thread and attachment manifest
- 명령 하나로 demo 재현
- schema와 data를 사람이 눈으로 검토 가능하게 유지

추후 mailbox provider API, attachment parser, web dashboard, database로 확장할 수 있지만, v0에서는 email-first workflow를 끝까지 관통하는 것이 우선이다.

</script>
<script type="text/markdown" data-id="02_object_model">

# Object Model

Kairen은 SAP-compatible procurement concept를 참고하되, AI Agent workflow에 맞게 단순화한다.

초기 MVP 관계:

```text
Intake Files
  -> PR / Sourcing Request
PR / Sourcing Request
  -> RFQ
      -> Supplier
      -> Email Thread
          -> Email Message
          -> Attachment
      -> SQ
          -> QI
  -> Compare
  -> Decision
```

## Intake File

Intake File은 고객이 처음 제공한 모든 입력 단위다.

입력은 zip일 수도 있지만, 실제로는 다음처럼 섞일 수 있다.

- email body
- folder
- PDF drawing/spec
- Excel BOM/quote
- image/photo/screenshot
- CAD file
- text memo
- previous quote
- compressed archive

MVP v0는 실제 파일 parser를 구현하기보다, 먼저 모든 입력을 `intake_files.csv`로 등록하고 processing task를 만든다.

핵심 field:

- `file_id`
- `pr_id`
- `source_channel`
- `original_filename`
- `file_type`
- `storage_path`
- `intake_role`
- `extraction_method`
- `extraction_status`
- `linked_object`
- `notes`

## PR / Sourcing Request

PR은 고객의 sourcing intent를 담는 시작 object다. 여러 intake file을 구조화한 결과로 생성되거나 보강된다.

전통적인 purchase requisition보다 넓게 본다. 고객이 처음부터 완전한 정보를 주지 않아도 된다. 모르는 정보는 error가 아니라 agent task다.

핵심 field:

- `pr_id`
- `title`
- `pr_type`
- `objective`
- `quantity`
- `uom`
- `baseline_unit_price`
- `currency`
- `disclosure_level`
- `missing_info`

## RFQ

RFQ는 supplier-facing executable package다.

RFQ는 다음 질문에 답해야 한다.

> 무엇을, 어떤 사양으로, 몇 개, 어떤 납기와 조건으로, 어떤 기준으로 비교하기 위해 견적을 요청하는가?

MVP v0에서는 별도 `rfq.csv` 없이 PR과 item data에서 `rfq_draft.md`와 `email_draft_queue.csv`를 생성한다. 이후 revision이 필요해지면 `rfq.csv`를 추가한다.

## Supplier

Supplier는 견적 요청 후보 또는 응답 주체다.

핵심 field:

- `supplier_id`
- `supplier_name`
- `country`
- `website`
- `contact_email`
- `process_capability`
- `source_url`
- `fit_score`

MVP v0의 supplier data는 모두 synthetic 또는 공개적으로 만들어낸 demo 값이다.

## Email Thread

Email Thread는 RFQ와 supplier communication을 연결하는 실행 object다.

현실에서는 quote가 본문, Excel, PDF, 이미지, 압축파일, 여러 차례의 답장으로 들어온다. 따라서 thread는 단순 message log가 아니라 RFQ/SQ/QI 업데이트의 source-of-truth entry point다.

핵심 field:

- `thread_id`
- `rfq_id`
- `supplier_id`
- `mailbox`
- `subject`
- `status`
- `last_activity_at`
- `next_action`

## Email Message

Email Message는 thread 안의 개별 inbound/outbound message다.

핵심 field:

- `message_id`
- `thread_id`
- `direction`
- `from_email`
- `to_email`
- `cc_email`
- `sent_at`
- `subject`
- `body_text_path`
- `has_attachments`
- `needs_human_review`

## Attachment

Attachment는 email message에 붙은 파일 또는 파일에서 추출해야 할 evidence다.

MVP v0에서는 실제 binary parser를 구현하지 않고, attachment manifest와 extraction task를 만든다.

핵심 field:

- `attachment_id`
- `message_id`
- `supplier_id`
- `original_filename`
- `file_type`
- `storage_path`
- `extraction_method`
- `extraction_status`
- `linked_object`
- `notes`

## SQ / Supplier Quotation

SQ는 특정 supplier가 특정 RFQ에 대해 준 응답 object다.

SQ는 supplier별 response/event log로 본다. 같은 supplier가 수정 견적을 주면 추후 revision을 올릴 수 있다.

SQ는 가능하면 email thread와 attachment evidence에 연결되어야 한다.

핵심 field:

- `sq_id`
- `rfq_id`
- `supplier_id`
- `status`
- `response_summary`
- `received_at`
- `source_thread_id`
- `source_message_id`
- `source_attachment_id`

## QI / Quote Item

QI는 SQ 안의 item-level quote row다.

필요한 이유:

- 하나의 SQ에 여러 item quote가 들어갈 수 있다.
- supplier마다 quote 가능한 item이 다를 수 있다.
- 최종 비교는 supplier 단위가 아니라 item x supplier matrix로 해야 한다.

핵심 field:

- `qi_id`
- `sq_id`
- `item_id`
- `quote_qty`
- `quote_unit_price`
- `currency`
- `moq`
- `lead_time_days`
- `tooling_cost`
- `sample_cost`
- `trade_terms`
- `risk_comment`

## Compare / Quote Matrix

Compare는 item x supplier 단위의 의사결정 table이다.

포함할 정보:

- item
- supplier
- quote status
- unit price
- MOQ
- lead time
- tooling/sample cost
- trade terms
- risk comment
- source message or attachment
- estimated savings

## Decision Report

Decision report는 사람이 다음 action을 정할 수 있게 만든다.

포함할 정보:

- best quote by item
- estimated savings
- missing information
- quote gap
- supplier risk
- attachment extraction status
- source evidence gap
- recommended next action
- human approval checklist

## Revision Rule

초기 rule:

```text
Small commercial/spec change -> RFQ revision
Major process/item/drawing change -> new RFQ
Different business objective -> new PR
```

MVP v0에서는 revision storage를 구현하지 않고, report에 추후 action으로 남긴다.

</script>
<script type="text/markdown" data-id="03_data_boundary">

# Data Boundary

이 공유 폴더는 MVP 제작을 위한 최소 정보만 담는다.

## Synthetic-only Rule

MVP v0의 모든 demo input은 synthetic data여야 한다.

사용 가능:

- 가상의 customer email body
- 가상의 PDF/Excel/image/text/folder input metadata
- 가상의 CNC part
- 가상의 baseline price
- 가상의 supplier response
- 가상의 quote line item
- 가상의 email thread metadata
- 가상의 Excel/PDF/image attachment metadata
- 가상의 extracted text
- 공개 가능한 단순 제조 예시를 바탕으로 새로 쓴 spec
- 사람이 만든 dummy contact

사용 금지:

- 실제 고객명과 연결된 도면, BOM, 견적, 가격
- 전/현 직장의 내부 자료
- 비공개 공급사 목록
- 실제 공급사 contact DB
- 계정 비밀정보 또는 접근 정보
- NDA 대상 자료
- 개인 메일함 원문이나 외부 thread 원문
- 실제 견적서 원본 PDF/Excel/image
- 실제 CAD/도면/사진 원본

## Human Approval Gates

MVP v0는 다음 지점에서 사람 승인을 전제로 한다.

- RFQ draft가 외부 발송 가능한지 확인
- 고객명 공개 여부
- 도면 또는 첨부 공개 여부
- supplier shortlist 공개 여부
- supplier에게 추가 질문을 보낼지 여부
- quote recommendation을 고객에게 제시할지 여부
- inbound attachment를 시스템에 보관/처리해도 되는지 여부
- customer intake file을 시스템에 보관/처리해도 되는지 여부
- OCR 또는 LLM 추출 결과를 quote matrix에 반영할지 여부

## Supplier-facing Position

초기 supplier-facing 표현은 다음처럼 둔다.

> We are a sourcing partner representing a manufacturing customer.

MVP v0 문서와 script는 이 문장을 template 수준으로만 보관한다. 실제 외부 발송은 하지 않는다.

## Email Safety Rule

실제 이메일 연동을 붙일 때도 default mode는 다음 순서여야 한다.

```text
draft -> human review -> approved send -> thread ingestion -> attachment extraction -> human review -> SQ/QI update
```

고객 입력도 같은 방식으로 처리한다.

```text
raw intake -> manifest -> extraction task -> human review -> PR/RFQ update
```

자동 발송과 자동 quote 확정은 분리한다.

MVP v0 script는 실제 mailbox에 접속하지 않는다. 대신 mailbox integration을 붙일 수 있도록 thread/message/attachment schema를 먼저 고정한다.

## Storage Rule

이 폴더에는 다음만 둔다.

- synthetic input
- synthetic intake file metadata
- generated output
- schema
- build spec
- harness script
- implementation backlog
- email thread와 attachment ingestion 구조

이 폴더에 넣지 않는다.

- 원본 vault 내부 경로 목록
- 개인적 회의 맥락
- 법무/법인/가격/계약 세부
- 실제 외부 커뮤니케이션 원문

</script>
<script type="text/markdown" data-id="04_backlog">

# Implementation Backlog

## Milestone 1: Email-aware Demo Harness

Goal: synthetic CNC case를 명령 하나로 실행해 email/attachment-aware report까지 생성한다.

Tasks:

- CSV reader와 기본 validation 구현
- intake file manifest 생성
- input file별 processing task 생성
- RFQ draft Markdown 생성
- missing information을 clarification question으로 변환
- supplier longlist 정렬
- supplier별 email draft queue 생성
- inbound email thread/message sample을 register로 정리
- attachment manifest와 extraction task 생성
- SQ/QI를 item x supplier matrix로 병합
- savings summary 계산
- decision report 생성

Acceptance criteria:

- `python scripts/run_demo.py --case data/synthetic_cnc_case --out outputs/demo_cnc_001` 실행 성공
- expected output 파일이 모두 생성됨
- zip이 아닌 개별 PDF/Excel/image/text/folder 입력도 intake queue에 남음
- quote가 없는 item/supplier 조합도 matrix에 남음
- email thread와 attachment가 supplier/SQ와 연결됨
- decision report에 email/attachment review gap이 보임

## Milestone 2: Data Model Tightening

Goal: IntakeFile/PR/RFQ/EmailThread/Attachment/SQ/QI/Supplier field를 안정화한다.

Tasks:

- required column validation 강화
- 숫자 field parsing rule 정리
- email status enum 정리
- intake role과 extraction method enum 정리
- attachment extraction status enum 정리
- RFQ revision field 추가 여부 검토
- item-level baseline price를 표준 field로 승격할지 결정

Acceptance criteria:

- schema와 sample data가 일치함
- 잘못된 CSV가 들어오면 어떤 column이 문제인지 알려줌
- report에서 입력 row와 source attachment trace가 가능함

## Milestone 3: Agent and Extraction Prompt Layer

Goal: 실제 AI/OCR 호출 전 단계의 prompt template을 분리한다.

Tasks:

- intake extraction prompt draft
- RFQ generation prompt draft
- supplier discovery scoring prompt draft
- email reply classification prompt draft
- attachment extraction prompt draft
- quote extraction prompt draft
- decision report prompt draft

Acceptance criteria:

- prompt template은 synthetic example만 포함함
- 외부 발송 prompt와 internal analysis prompt를 분리함
- attachment extraction result는 사람이 승인하기 전까지 tentative로 남김

## Milestone 4: Human Review Workflow

Goal: 사람이 승인해야 하는 지점을 output으로 명확히 보여준다.

Tasks:

- approval checklist 생성
- missing info checklist 생성
- supplier disclosure checklist 생성
- RFQ draft review status 추가
- email send approval status 추가
- attachment extraction review status 추가

Acceptance criteria:

- decision report에 `Needs Human Approval` section이 있음
- 외부 발송 전 확인할 항목이 빠지지 않음
- quote matrix에 반영된 값의 source message/attachment가 추적됨

## Milestone 5: Next Integration Options

Goal: v0 이후 확장 후보를 정리한다.

Options:

- Google Sheet export
- lightweight web dashboard
- email draft creation
- mailbox provider ingestion
- file attachment parser
- PDF/OCR extraction
- LLM-based supplier discovery
- LLM-based quote extraction

Acceptance criteria:

- v0 object model을 깨지 않고 확장 가능함
- 실제 외부 발송은 별도 승인 flow가 생긴 뒤 진행함

<script type="text/markdown" data-id="05_email_wf">

# Email and Attachment Workflow

Kairen MVP는 email-first sourcing workflow를 현실 기준으로 다룬다.

Supplier communication은 보통 다음처럼 들어온다.

- 본문에 가격/납기/MOQ가 직접 적혀 있음
- Excel quote sheet 첨부
- PDF 견적서 첨부
- 도면 이미지 또는 사진 첨부
- 여러 supplier contact가 CC로 들어옴
- 같은 thread 안에서 조건이 계속 수정됨
- AI/operator 계정이 thread에서 빠지면 visibility가 사라짐

## Workflow

```text
RFQ draft
-> email draft queue
-> human approval
-> send from controlled mailbox
-> inbound reply captured
-> body text saved
-> attachments indexed
-> extraction task created
-> SQ updated
-> QI rows extracted
-> quote matrix and decision report updated
```

## v0 Implementation Boundary

이번 빌드팩은 다음을 구현한다.

- email draft queue 생성
- email thread register 생성
- inbound email message metadata sample
- attachment manifest 생성
- attachment extraction task 생성
- SQ/QI와 source email/attachment 연결을 위한 schema

이번 빌드팩은 다음을 구현하지 않는다.

- 실제 mailbox login
- 실제 email send API call
- 실제 PDF/OCR/Excel parser
- 실제 attachment binary 보관
- 자동 발송 또는 자동 quote 확정

## Controlled Mailbox Rule

실제 제품에서는 개인 메일함이 아니라 controlled mailbox를 사용한다.

권장 mailbox pattern:

```text
rfq@company-domain
reply-to: rfq@company-domain
cc: operator/review mailbox
one RFQ per supplier thread
```

필수 조건:

- RFQ별 thread id를 저장한다.
- supplier가 reply할 때 운영 mailbox가 빠지지 않게 한다.
- inbound message와 attachment를 RFQ/SQ에 연결한다.
- 사람이 보기 전에는 quote data를 확정하지 않는다.

## Attachment Handling

Attachment는 파일 자체보다 evidence chain이 중요하다.

각 attachment는 다음 질문에 답해야 한다.

- 어느 supplier가 보냈는가?
- 어느 RFQ/SQ와 연결되는가?
- 원본 filename과 file type은 무엇인가?
- 저장 위치는 어디인가?
- 어떤 extraction method가 필요한가?
- extraction이 끝났는가?
- 어떤 QI row의 근거가 되는가?
- 사람이 검토했는가?

## Extraction Method

MVP v0의 extraction method 후보:

- `body_text`: email 본문에서 직접 추출
- `spreadsheet_manual`: Excel/CSV를 사람이 열어 CSV로 정규화
- `pdf_text_or_ocr`: PDF text 추출 또는 OCR
- `image_ocr`: image OCR
- `manual_review`: 사람이 확인 필요

## Send Safety

실제 email send 기능을 붙일 때도 send는 별도 gate로 둔다.

추천 상태:

```text
draft_ready
review_requested
approved_to_send
sent
reply_received
extraction_pending
quote_review_pending
quote_approved
```

MVP harness는 `draft_ready`까지만 자동 생성한다.

</script>
<script type="text/markdown" data-id="06_current_wf">

# Current Workflow (As-Is) and Automation Target (To-Be)

수동으로 이미 돌고 있는 sourcing workflow를 정리하고, API 연동으로 어디까지 자동화할지 정한다. 사업의 첫 번째 wedge는 "이미 사람이 손으로 하고 있는 일을 자동화"하는 것이다.

## Scope 결정 (2026-05-25)

- **Supplier 범위**: Alibaba.com으로 한정 (필요 시 일반 인터넷 검색 보조)
- **Communication 채널**: Outlook (Microsoft 365 또는 개인 Outlook)
- **자동화 방식**: 정식 API 우선, 어려우면 third-party scraper 허용
- **Human-in-the-loop 원칙은 유지**: 자동 발송은 하지 않는다. Draft까지만 자동.

## As-Is: 현재 수동 workflow

사람이 Codex 앱(ChatGPT의 코드/에이전트 환경)을 도구로 써서 다음 단계를 직접 수행한다.

```text
1. 고객 요구사항 받음 (메일/문서/구두)
2. Codex 앱으로 Alibaba 및 일반 웹에서 supplier 검색
3. 사람이 후보 정리
4. Codex 앱이 Outlook 메일 초안을 작성해 임시저장(Drafts)
5. 사람이 Drafts 열고 검토
6. 사람이 발송
7. supplier 답신 도착
8. 사람이 답신 읽고 정리
9. 견적 비교는 사람이 직접
```

이 흐름은 동작하지만 다음 단계에서 사람 손이 너무 많이 들어간다.

- supplier 검색 결과 정리 (수십 곳 비교)
- 메일 초안 검토 (supplier마다 spec/표현 차이)
- 답신 본문에서 가격/MOQ/lead time 추출
- 첨부 PDF/Excel에서 quote 추출
- supplier 간 비교표 만들기

## To-Be: 자동화 목표

목표는 **end-to-end 자동화가 아니라 사람 검토 지점을 명확히 한 semi-automation**이다.

```text
1. 고객 요구사항 입력 (form 또는 메일)
2. [AUTO] Alibaba API/scraper로 supplier 검색
3. [AUTO] LLM이 supplier 후보 fit_score로 정렬
4. [HUMAN] supplier shortlist 승인
5. [AUTO] supplier별 메일 초안 생성 → Microsoft Graph로 Outlook Drafts에 저장
6. [HUMAN] Drafts 검토 후 발송
7. [AUTO] Graph API로 inbound 답신 capture
8. [AUTO] 본문/첨부에서 quote 추출 → QI row 생성
9. [HUMAN] 추출 결과 검토 후 quote matrix 확정
10. [AUTO] decision report 생성
11. [HUMAN] 최종 의사결정
```

## Alibaba 연동 옵션

### Option A: Alibaba.com 공식 API

조사 결과, Alibaba.com의 **buyer-facing supplier search 공식 API는 외부 개발자에게 잘 열려 있지 않다**. 검색에서 노출되는 것은 주로:

- **Alibaba Cloud / AI Search Open Platform**: LLM·검색 인프라 서비스이지 Alibaba.com 마켓플레이스 데이터가 아님
- **Alibaba.com RFQ Markets**: buyer가 RFQ를 등록하고 supplier가 응답하는 UI 기능. API 자동화는 표준 채널이 아님
- **Seller-facing API**: supplier 등록용. buyer-side sourcing에는 부적합

정식 API 채택은 어려움. 파트너십이 필요할 가능성이 큼.

### Option B: Third-party scraper (현실적 first step)

Apify 마켓플레이스에 다수의 Alibaba scraper actor가 있다. 검증된 후보:

- `shareze001/scrape-alibaba-suppliers`: supplier 프로필 + Gold tier, factory size, 직원 수, 응답률
- `scraperx/alibaba-scraper`: product listing + supplier metadata (JSON 출력)
- `lexis-solutions/alibaba-scraper`: 상품·카테고리 페이지
- `cloud9_ai/alibaba-scraper`: MOQ, 가격, Trade Assurance, 인증 정보
- `simpleapi/alibaba-listings-scraper`: 검색 결과 페이지네이션
- Alibaba Email Scraper (별도 actor): supplier 연락처 이메일 추출

API 형태: Apify REST API로 HTTP POST 호출 → JSON dataset 반환. Python/Node에서 바로 호출 가능. 프록시는 Apify 측에서 관리.

**주의사항**:

- Alibaba ToS 위반 가능성 있음 (scraping). 법무 검토 필요.
- 결과 schema가 actor마다 다름 → 우리 쪽 normalization layer 필요.
- Alibaba가 layout/anti-bot 변경 시 actor가 깨질 수 있음 → fallback 또는 actor 다중화 전략 필요.
- supplier email 자동 추출 후 cold outreach는 spam/평판 리스크가 큼 → 첫 발송은 반드시 사람 승인.

### Option C: Browser automation (Claude in Chrome, Playwright)

scraper actor가 막힐 때를 위한 fallback. 더 유연하지만 더 느리고 비싸다. v0에서 우선순위 낮음.

### 권고

- **v0 build phase**: Apify actor 1-2개 선택 → 검색 → 정규화 → CSV로 저장. 법무 리스크는 "synthetic demo + 내부 테스트 한정"이라는 boundary로 관리.
- **v1 paid customer phase 전**: Alibaba 공식 파트너십 가능성 타진. 동시에 ToS 리스크에 대한 변호사 자문.

## Outlook 연동 옵션

### Microsoft Graph API

Outlook draft 자동 생성·발송은 Microsoft Graph API의 표준 기능이다.

핵심 엔드포인트(이 부분은 build 단계에서 정확한 spec 재확인 필요):

- 메일 draft 생성: `POST /me/messages`
- draft 발송: `POST /me/messages/{id}/send`
- inbound 메일 조회: `GET /me/mailFolders/inbox/messages`
- 첨부 다운로드: `GET /me/messages/{id}/attachments/{attachmentId}`
- 변경 알림(webhook): `POST /subscriptions`

인증 방식은 계정 종류에 따라 다르다.

- **개인 Outlook 계정 (outlook.com, hotmail.com)**: OAuth 2.0 + delegated permission
- **Microsoft 365 비즈니스 계정**: Azure AD app registration, delegated 또는 application permission 가능. application permission이 있으면 mailbox에 사람 로그인 없이도 접근 가능
- **Exchange Online with mailbox shared**: controlled mailbox(`rfq@company-domain`) 운영에 적합

### Send Safety Rule (불변)

자동 발송은 v0~v1 전체에 걸쳐 **금지**. Graph API로는 `Drafts`까지만 만든다. 사람이 Outlook을 열고 보내야 한다.

이유:

- B2B 첫 outreach에서 자동 발송이 들통나면 신뢰가 무너진다.
- spec 오류, 가격 오타, 잘못된 supplier에게 도면 노출 등의 사고를 막을 마지막 게이트가 필요하다.

## 자동화 아키텍처 초안 (v0 → v1)

```text
[Customer intake]
   │
   ▼
[Intake parser]  ← LLM (Claude/GPT API)
   │
   ▼
[PR/RFQ generator] ← LLM
   │
   ▼
[Alibaba supplier search]
   │   └─ Apify actor (REST)
   ▼
[Supplier normalizer + fit_score]  ← LLM
   │
   ▼ (HUMAN APPROVAL: shortlist)
   │
   ▼
[Email draft generator]  ← LLM (per supplier)
   │
   ▼
[Microsoft Graph: create draft in Outlook]
   │
   ▼ (HUMAN APPROVAL: open Outlook and send)
   │
   ▼
[Microsoft Graph: poll inbox / webhook]
   │
   ▼
[Email body + attachment extractor]  ← LLM + OCR + table parser
   │
   ▼ (HUMAN APPROVAL: tentative quote review)
   │
   ▼
[QI row writer → quote matrix]
   │
   ▼
[Decision report generator]  ← LLM
   │
   ▼ (HUMAN DECISION)
```

이 그림에서 노란 박스는 모두 LLM 호출, 파란 박스는 외부 API/scraper다. 모든 HUMAN APPROVAL 지점은 build 시 명시적 status field와 UI/CLI로 노출해야 한다.

## v0 Backlog 변경 제안

기존 `04_Implementation_Backlog.md`의 Milestone 5(Next Integration Options)에서 다음 항목을 **Milestone 2 또는 3으로 승격**하는 것을 검토:

- Alibaba scraper integration (Apify actor 1개로 PoC)
- Microsoft Graph draft creation (test mailbox로 PoC)
- inbound polling + attachment download

이 세 가지가 동작하면 "synthetic demo"가 아니라 "real but small" demo가 가능하고, 잠재 고객 인터뷰에서 보여줄 수 있는 무기가 된다.

## Open Questions

다음 단계 결정 전에 답해야 할 것:

1. 운영용 Outlook 계정은 개인용인가 M365 비즈니스인가? (인증 방식이 갈림)
2. Alibaba scraper 사용을 사업화 단계에서도 유지할 수 있나? (ToS, 법무, 안정성)
3. 첫 paying customer는 어떤 카테고리·국가의 supplier가 필요한가? (Alibaba가 정말 맞는 base인지 검증)
4. supplier 응답 첨부의 주 포맷은? (PDF/Excel/메일본문 중 무엇이 다수인지에 따라 extractor 우선순위 결정)
5. 1차 demo 대상 카테고리를 CNC로 유지할지, standard parts로 바꿀지 (리뷰 우려 #3)

<script type="text/markdown" data-id="rv_2026_05_25">

# Business Review — Kairen MVP v0

Kairen MVP 빌드팩(00~05)을 기반으로 사업화 관점에서 검토한 의견. 칭찬과 우려를 섞어 의사결정에 도움이 되도록 정리한다.

## 강점 — 잘 잡은 부분

### 1. 문제 선택이 좋다

B2B sourcing/RFQ 과정은 실제로 메일·PDF·엑셀·이미지가 뒤섞여 들어오고, 정보가 thread를 따라 흩어지는 진짜 고통이다. AI가 잘하는 일(비정형 입력 정규화, 초안 작성, 비교표 만들기)과 정확히 겹친다. 시장 timing도 나쁘지 않다 — LLM이 OCR/추출에서 신뢰할 만한 수준이 된 지 약 1-2년 됐다.

### 2. "AI extracts and drafts, human approves" 원칙이 현명하다

B2B 구매는 실수 한 번이 계약/평판으로 직결되는 영역이라, 풀-오토메이션 약속은 오히려 신뢰를 깎는다. Human-in-the-loop을 처음부터 못 박은 건 영업·법무·보안 측면 모두에서 옳은 선택이다.

### 3. Object model이 깔끔하다

Intake → PR → RFQ → Thread → Attachment → SQ → QI → Compare → Decision의 분해는 SAP MM/Coupa 같은 기존 절차를 알고 쓴 느낌이고, item × supplier matrix를 비교 단위로 잡은 것도 정확하다. SQ를 event log로 보고 QI를 별도로 분리한 것도 현실에 맞다.

### 4. Email-first + controlled mailbox가 현실적이다

별도 SaaS 포털에 supplier를 끌어들이려는 시도는 거의 다 실패한다. Supplier는 자기 메일에서 답장하길 원한다. 이걸 받아들인 게 큰 차별점이다.

### 5. Synthetic-only, NDA 회피, 전 직장 자료 배제

법적/윤리적 boundary를 처음부터 문서화한 건 진지한 창업자의 신호다.

## 우려 — 더 깊이 생각해볼 것

### 1. 가장 큰 질문: 누가, 왜, 얼마에 사는가? — 비즈니스 모델이 거의 안 보인다

문서 전체가 "무엇을 만들 것인가"에 집중되어 있고, "누가 이걸로 통증을 느끼는가"가 빠져 있다. 같은 workflow에 fit하는 buyer persona가 최소 4종류는 된다.

- 중소 제조사의 구매 담당자 1-2명 (RFQ를 직접 돌림)
- 미드마켓 구매팀 (Coupa/Ariba 너무 무겁고 비쌈)
- Sourcing agency / trading company (대신 sourcing해주고 마진 먹음)
- 신제품/시제품 단계 하드웨어 스타트업 (구매팀 자체가 없음)

각각 sales motion, 가격, 기능 우선순위가 완전히 다르다. 예컨대 sourcing agency라면 "내 client에게 보여줄 깔끔한 decision report"가 핵심 기능이고, 제조사 구매팀이라면 "ERP/회계 연동"이 결정 요인이 된다. **MVP 다음 단계로 가기 전에 이 중 하나를 골라야 한다.**

### 2. Competitive landscape에 대한 명시적 분석이 빠져 있다

- **Keelvar, Fairmarkit, Globality, Arkestro, Scoutbee** — 다 AI sourcing/RFQ를 표방하고, 일부는 펀딩이 9자리($100M+)다.
- **Ariba, Coupa, Jaggaer** — 무겁지만 enterprise 표준.
- **Pivot, Levelpath, Zip, Omnea** — intake-to-procure 신생 SaaS들이 2022-2024에 대거 등장했고 일부는 Series B/C까지 갔다.

Kairen의 wedge가 (a) email-first의 진정성, (b) 한국/아시아 제조 supplier base에 대한 강점, (c) 특정 카테고리(CNC, 사출, PCB 같은) 깊이 — 셋 중 무엇인지 정해야 한다. "AI sourcing platform"으로 그냥 들어가면 위 회사들과 정면 충돌이고 자본 싸움이다.

### 3. CNC를 demo로 잡은 이유가 spec에 없다

CNC machining은 견적 variance가 크고(재질·후처리·tolerance·수량 곡선), supplier 풀이 매우 fragmented하고, 도면 해석이 필수라 — AI가 실제로 가치를 만들기 가장 어려운 카테고리 중 하나다. 반대로 **standard parts (fasteners, electronics components, packaging, 라벨/인쇄, MRO)** 같은 카테고리는 quote extraction이 훨씬 쉽고, RFQ를 자주 돌려서 traction이 빠르다. CNC가 *최종 비전*인 건 좋지만 *first wedge*로는 reconsider할 가치가 있다.

### 4. v0 이후의 진짜 어려운 부분이 backlog에 살짝만 표시되어 있다

문서에서 "PDF/OCR/Excel parser는 v0 범위 아님"으로 미뤄두었는데, 솔직히 **이게 제품의 90%다.** Email draft queue나 CSV manifest는 한 주에 만들 수 있다. 어려운 건:

- 다양한 supplier의 비표준 quote 포맷 → 구조화된 QI row로 변환 (LLM + 검증)
- 같은 part가 supplier마다 다르게 표기될 때 매칭 (part normalization)
- 도면 첨부에서 핵심 spec 추출 (vision model + 사람 검증)
- thread에서 가격 revision을 추적해 "현재 유효 quote"를 유지

여기서 정확도/신뢰도가 안 나오면 product가 안 팔린다. v0의 harness는 좋은 skeleton이지만, **다음 milestone에서 진짜 시험되는 건 추출 정확도**라는 걸 명시적으로 인지하고 계획해야 한다.

### 5. "Supplier Discovery" 부분이 약하다

Object model에 `Supplier`가 있고 `fit_score`, `source_url`이 있지만, 어떻게 supplier를 찾을지에 대한 설계가 보이지 않는다. 이게 사실 두 개의 별개 제품이다.

- **Quote workflow tool** (이미 거래하는 supplier에게 RFQ 돌리기) — 진입장벽 낮음, 단가 낮음
- **Supplier discovery engine** (새 supplier 찾기) — 진입장벽 높음, 단가 높음, 차별화 큼

둘 다 한다고 하면 focus가 흐려진다.

> **2026-05-25 업데이트**: 알리바바로 supplier 범위를 한정하기로 결정. discovery 범위가 명확해져서 두 제품을 동시에 진행하는 부담이 줄어듦.

## 종합 의견

**컨셉과 실행력은 진지하고, object model은 1주차 작업물 치고 잘 잡혀 있다.** 다만 지금 문서는 "엔지니어링 spec"이지 "사업 plan"은 아니다. 사업으로 가려면 다음 한 달 안에 답이 나와야 할 것:

1. **First wedge customer 1-2명** (실명, 실제 통증, 돈 쓸 의사) — synthetic demo 만든 뒤 곧바로 5-10명 인터뷰
2. **카테고리 선택의 근거** (왜 CNC인가, 혹은 다른 것으로 바꿔야 하는가)
3. **Wedge 가설** (Keelvar/Fairmarkit/Zip 대비 1년 안에 이길 수 있는 좁은 영역)

기술 build는 잘 진행하되, build와 병행해서 **이번 주에 잠재 고객 3명과 인터뷰 약속**을 잡는 걸 권한다. Spec에 시간을 더 쓰는 것보다 그게 훨씬 큰 ROI다.

<script>
const DOCS = [{"id": "00_start_here", "title": "00 · START HERE", "group": "Build Pack", "path": "00_START_HERE.md"}, {"id": "01_mvp_build_spec", "title": "01 · MVP Build Spec", "group": "Build Pack", "path": "01_MVP_Build_Spec.md"}, {"id": "02_object_model", "title": "02 · Object Model", "group": "Build Pack", "path": "02_Object_Model.md"}, {"id": "03_data_boundary", "title": "03 · Data Boundary", "group": "Build Pack", "path": "03_Data_Boundary.md"}, {"id": "04_backlog", "title": "04 · Implementation Backlog", "group": "Build Pack", "path": "04_Implementation_Backlog.md"}, {"id": "05_email_wf", "title": "05 · Email & Attachment Workflow", "group": "Build Pack", "path": "05_Email_Attachment_Workflow.md"}, {"id": "06_current_wf", "title": "06 · Current Workflow & Automation", "group": "Build Pack", "path": "06_Current_Workflow.md"}, {"id": "rv_2026_05_25", "title": "Business Review · 2026-05-25", "group": "Reviews", "path": "reviews/Business_Review_2026-05-25.md"}];

// Configure marked - keep it simple, version-agnostic
marked.setOptions({
  breaks: false,
  gfm: true,
});

function slugify(s) {
  return s.toLowerCase()
    .replace(/[^\w\s가-힣-]/g, '')
    .replace(/\s+/g, '-')
    .replace(/-+/g, '-')
    .replace(/^-|-$/g, '') || 'section';
}

// Assign ids to h2/h3 after rendering (works on any marked version)
function assignHeadingIds(rootEl) {
  const used = new Set();
  rootEl.querySelectorAll('h2, h3').forEach(h => {
    let base = slugify(h.textContent || '');
    let id = base;
    let i = 2;
    while (used.has(id)) { id = base + '-' + i++; }
    used.add(id);
    h.id = id;
  });
}

function getMarkdown(docId) {
  const el = document.querySelector(`script[type="text/markdown"][data-id="${docId}"]`);
  return el ? el.textContent.trim() : '';
}

function buildNav() {
  const nav = document.getElementById('nav');
  const groups = {};
  DOCS.forEach(d => {
    if (!groups[d.group]) groups[d.group] = [];
    groups[d.group].push(d);
  });
  let html = '';
  Object.keys(groups).forEach(g => {
    html += `<div class="nav-group">`;
    html += `<div class="nav-group-title">${g}</div>`;
    groups[g].forEach(d => {
      const parts = d.title.split('·');
      const num = parts.length > 1 ? parts[0].trim() : '';
      const name = parts.length > 1 ? parts.slice(1).join('·').trim() : d.title;
      html += `<div class="nav-item" data-doc="${d.id}">`;
      if (num) html += `<span class="nav-num">${num}</span>`;
      html += `<span>${name}</span></div>`;
    });
    html += `</div>`;
  });
  nav.innerHTML = html;
  nav.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
      loadDoc(item.dataset.doc);
      document.getElementById('sidebar').classList.remove('open');
    });
  });
}

function buildToc(docId) {
  const toc = document.getElementById('toc');
  const headings = document.querySelectorAll('#content h2, #content h3');
  if (headings.length === 0) {
    toc.innerHTML = '';
    return;
  }
  let html = `<div class="toc-title">On this page</div>`;
  headings.forEach(h => {
    const depth = h.tagName === 'H2' ? 2 : 3;
    html += `<a class="toc-link depth-${depth}" href="#${h.id}" data-target="${h.id}">${h.textContent}</a>`;
  });
  toc.innerHTML = html;
  toc.querySelectorAll('.toc-link').forEach(link => {
    link.addEventListener('click', (e) => {
      e.preventDefault();
      const target = document.getElementById(link.dataset.target);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
}

function buildPager(docId) {
  const idx = DOCS.findIndex(d => d.id === docId);
  const prev = idx > 0 ? DOCS[idx - 1] : null;
  const next = idx < DOCS.length - 1 ? DOCS[idx + 1] : null;
  const pager = document.getElementById('pager');
  let html = '';
  if (prev) {
    html += `<a href="#${prev.id}" data-doc="${prev.id}" class="prev"><span class="label">← 이전</span><span class="title">${prev.title}</span></a>`;
  } else {
    html += `<a class="prev disabled"><span class="label">← 이전</span><span class="title">처음 문서입니다</span></a>`;
  }
  if (next) {
    html += `<a href="#${next.id}" data-doc="${next.id}" class="next"><span class="label">다음 →</span><span class="title">${next.title}</span></a>`;
  } else {
    html += `<a class="next disabled"><span class="label">다음 →</span><span class="title">마지막 문서입니다</span></a>`;
  }
  pager.innerHTML = html;
  pager.querySelectorAll('a[data-doc]').forEach(a => {
    a.addEventListener('click', (e) => {
      e.preventDefault();
      loadDoc(a.dataset.doc);
    });
  });
}

function buildMeta(doc) {
  const meta = document.getElementById('doc-meta');
  const parts = [
    `<span class="meta-pill">${doc.path}</span>`,
    `<span class="meta-pill">${doc.group}</span>`,
  ];
  meta.innerHTML = parts.join('');
}

let currentDocId = null;

function loadDoc(docId) {
  const doc = DOCS.find(d => d.id === docId);
  if (!doc) return;
  currentDocId = docId;

  const content = document.getElementById('content');
  try {
    const md = getMarkdown(docId);
    if (!md) {
      content.innerHTML = '<p style="color:#fbbf24">⚠ 마크다운 내용을 찾을 수 없어요 (data-id: ' + docId + ')</p>';
      return;
    }
    if (typeof marked === 'undefined' || !marked.parse) {
      content.innerHTML = '<p style="color:#fbbf24">⚠ marked.js 라이브러리가 로드되지 않았어요. 네트워크 연결을 확인해주세요.</p>';
      return;
    }
    const html = marked.parse(md);
    content.innerHTML = html;
    assignHeadingIds(content);
  } catch (err) {
    content.innerHTML = '<p style="color:#fbbf24">⚠ 렌더링 에러: ' + (err && err.message ? err.message : String(err)) + '</p>';
    console.error('Render error:', err);
    return;
  }

  // Restart fade animation
  content.style.animation = 'none';
  void content.offsetWidth;
  content.style.animation = '';

  buildMeta(doc);
  buildToc(docId);
  buildPager(docId);

  // Sync nav active
  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.toggle('active', n.dataset.doc === docId);
  });

  // Update hash
  history.replaceState(null, '', '#' + docId);

  // Scroll to top of main
  window.scrollTo({ top: 0, behavior: 'instant' });

  // Update TOC active on scroll
  attachScrollSpy();
}

let scrollSpyHandler = null;
function attachScrollSpy() {
  if (scrollSpyHandler) window.removeEventListener('scroll', scrollSpyHandler);
  const headings = Array.from(document.querySelectorAll('#content h2, #content h3'));
  const links = Array.from(document.querySelectorAll('#toc .toc-link'));
  if (headings.length === 0) return;
  scrollSpyHandler = () => {
    const scrollPos = window.scrollY + 100;
    let activeId = headings[0].id;
    for (const h of headings) {
      if (h.offsetTop <= scrollPos) activeId = h.id;
      else break;
    }
    links.forEach(l => l.classList.toggle('active', l.dataset.target === activeId));
  };
  window.addEventListener('scroll', scrollSpyHandler, { passive: true });
  scrollSpyHandler();
}

// Keyboard navigation
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const idx = DOCS.findIndex(d => d.id === currentDocId);
  if (e.key === 'ArrowLeft' && idx > 0) {
    loadDoc(DOCS[idx - 1].id);
  } else if (e.key === 'ArrowRight' && idx < DOCS.length - 1) {
    loadDoc(DOCS[idx + 1].id);
  }
});

// Mobile toggle
document.getElementById('mobile-toggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
});

// Show keyboard hint briefly
window.addEventListener('load', () => {
  const hint = document.getElementById('kbd-hint');
  setTimeout(() => hint.classList.add('visible'), 1200);
  setTimeout(() => hint.classList.remove('visible'), 6500);
});

// Init - wait for DOM and marked.js to be ready
function init() {
  buildNav();
  const hashId = location.hash.slice(1);
  const initial = DOCS.find(d => d.id === hashId) ? hashId : DOCS[0].id;
  loadDoc(initial);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
